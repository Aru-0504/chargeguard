# Render Blueprint Specification for ChargeGuard
# Documentation: https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # 1. FastAPI Machine Learning & Dispute Evidence Backend API
  # -------------------------------------------------------------
  - type: web
    name: chargeguard-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chargeguard-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: PORT
        value: 8000
      - key: OPENAI_API_KEY
        sync: false

  # -------------------------------------------------------------
  # 2. Next.js 16 Fraud Review & Dispute Dashboard Frontend
  # -------------------------------------------------------------
  - type: web
    name: chargeguard-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: chargeguard-backend
          property: host
      - key: NODE_VERSION
        value: 20.18.0

databases:
  # -------------------------------------------------------------
  # 3. PostgreSQL Database
  # -------------------------------------------------------------
  - name: chargeguard-db
    databaseName: chargeguard
    user: chargeguard
    plan: free
