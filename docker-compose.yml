version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: chargeguard-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chargeguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chargeguard_password}
      POSTGRES_DB: ${POSTGRES_DB:-chargeguard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chargeguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chargeguard-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chargeguard}:${POSTGRES_PASSWORD:-chargeguard_password}@postgres:5432/${POSTGRES_DB:-chargeguard}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://frontend:3000}
    volumes:
      - ./backend/app:/app/app
      - ./agent:/app/agent
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chargeguard-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
