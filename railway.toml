# Railway configuration for ChargeGuard
# This configures the backend service. Deploy frontend separately.
# IMPORTANT: Remove any rootDirectory setting in Railway - this uses the root Dockerfile

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
dockerContext = "."

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
